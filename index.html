<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>School Mobile</title>

    <base href="/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <meta name="color-scheme" content="light dark" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="shortcut icon" id="app-favicon" type="image/png" href="/api/school/company-logo" />
    <link rel="icon" id="app-icon" type="image/png" href="/api/school/company-logo" />
    <link rel="apple-touch-icon" id="app-apple-icon" href="/api/school/company-logo" />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- add to homescreen for ios -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ionic App" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' http: https: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' http: https: data:; style-src 'self' 'unsafe-inline' http: https:; font-src 'self' http: https: data:; img-src 'self' data: http: https: blob:; connect-src 'self' http: https: data:;">
    <script>
      (function() {
        if (window.location.protocol === 'https:') {
          localStorage.removeItem('api_base_url');
          try {
            var cfg = localStorage.getItem('odoo_config');
            if (cfg && cfg.indexOf('http:') !== -1) {
              var parsed = JSON.parse(cfg);
              if (parsed && parsed.url && parsed.url.startsWith('http:')) {
                parsed.url = window.location.origin;
                localStorage.setItem('odoo_config', JSON.stringify(parsed));
              }
            }
          } catch(e) {}
        }
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].update();
            }
          });
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>

</html>
