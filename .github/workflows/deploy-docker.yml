name: Deploy School Mobile via Docker SSH

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH & Docker Compose
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || 'adminschool.sdbo.ma' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            TARGET_DIR="${{ secrets.SERVER_PATH }}"
            if [ -z "$TARGET_DIR" ]; then
              TARGET_DIR="/root/School_Mobile"
            fi
            mkdir -p $TARGET_DIR
            cd $TARGET_DIR
            if [ ! -d ".git" ]; then
              git clone https://github.com/othmanbakkali/School_Mobile.git .
            else
              git fetch origin main
              git reset --hard origin/main
              git pull origin main
            fi
            npm run build
            pm2 restart all 2>/dev/null || true
            pm2 stop school-app 2>/dev/null || true
            pkill -f "node server/index.js" 2>/dev/null || true
            docker compose down || true
            docker compose up -d --build
            docker image prune -f
            cp -r school_mobile_v2/* /opt/odoo19/odoo/addons/school_mobile_v2/ 2>/dev/null || true
            chown -R odoo19:odoo19 /opt/odoo19/odoo/addons/school_mobile_v2 2>/dev/null || true
            systemctl restart odoo19 2>/dev/null || true
